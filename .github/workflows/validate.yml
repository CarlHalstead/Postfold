name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install pinned .NET 10 SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Verify source privacy and text conventions
        shell: pwsh
        run: ./eng/Verify-Source.ps1
      - name: Check SDK health
        run: dotnet --info
      - name: Restore locked dependencies
        run: dotnet restore Postfold.slnx --locked-mode
      - name: Restore pinned EF tooling
        run: dotnet tool restore
      - name: Build
        run: dotnet build Postfold.slnx --configuration Release --no-restore
      - name: Verify formatting
        run: dotnet format Postfold.slnx --verify-no-changes --no-restore
      - name: Verify unused imports
        run: dotnet format style Postfold.slnx --verify-no-changes --no-restore --severity info --diagnostics IDE0005
      - name: Verify EF model snapshot
        run: dotnet ef migrations has-pending-model-changes --project Postfold.Storage --startup-project Postfold.Storage --context ProfileDbContext --configuration Release --no-build
      - name: Test foundation, engine, local TLS protocols and native platform capabilities
        run: dotnet test Postfold.slnx --configuration Release --no-build --no-restore --blame-hang-timeout 3m
